name: localaidocker

services:
  localai:
    image: ${LOCALAI_IMAGE:?Run scripts/llm.ps1 -Install first}
    restart: unless-stopped
    environment:
      # Keep all LocalAI-owned mutable stores on target-local bind mounts so
      # a forced container recreation does not discard backends, configuration,
      # or application data.  The LOCALAI_* spellings are the canonical
      # LocalAI variables; the short aliases remain for older image builds.
      LOCALAI_MODELS_PATH: /models
      LOCALAI_BACKENDS_PATH: /backends
      LOCALAI_CONFIG_DIR: /configuration
      LOCALAI_DATA_PATH: /data
      MODELS_PATH: /models
      THREADS: ${LOCALAI_THREADS:-8}
      CONTEXT_SIZE: ${LOCALAI_CONTEXT_SIZE:-4096}
      DEBUG: ${LOCALAI_DEBUG:-false}
    volumes:
      - type: bind
        source: ./data/models
        target: /models
      - type: bind
        source: ./data/backends
        target: /backends
      - type: bind
        source: ./data/configuration
        target: /configuration
      - type: bind
        source: ./data/localai
        target: /data
    networks:
      - inference
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:8080/readyz >/dev/null 2>&1 || curl -fsS --max-time 3 http://127.0.0.1:8080/healthz >/dev/null 2>&1 || curl -fsS --max-time 3 http://127.0.0.1:8080/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    # LocalAI dynamically loads its selected llama.cpp backend executable.
    # Keep the service unprivileged and network-scoped, but do not make the
    # image filesystem read-only because that prevents backend execution on
    # Docker Desktop's Linux engine.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  gateway:
    image: localaidocker/gateway:locked
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
      args:
        BASE_IMAGE: ${AGENT_BASE_IMAGE:?Run scripts/llm.ps1 -Install first}
    command: ["python", "-m", "agent.gateway"]
    environment:
      LOCALAI_URL: http://localai:8080
      AGENT_URL: http://agent:8090
      API_KEY_FILE: /run/secrets/localai_api_key
      HOST_BRIDGE_KEY_FILE: /run/secrets/host_bridge_key
      HOST_BRIDGE_URL: http://host.docker.internal:8765
      GATEWAY_BIND: 0.0.0.0:8080
      LOG_FILE: /app/logs/gateway.jsonl
    secrets:
      - localai_api_key
      - host_bridge_key
    depends_on:
      localai:
        condition: service_healthy
    ports:
      # 8080 is the preferred port, but the launcher selects and records a
      # free loopback port when another local service already owns it.
      - "127.0.0.1:${LOCALAI_GATEWAY_HOST_PORT:-8080}:8080"
    networks:
      - inference
      # Docker Desktop's internal bridge networks intentionally do not
      # publish container ports to Windows.  The gateway therefore uses the
      # dedicated frontend bridge for the loopback-only published endpoint;
      # its application routes remain limited to LocalAI, the agent, and the
      # explicitly configured host bridge.
      - frontend
    read_only: true
    volumes:
      - ./logs:/app/logs
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent:
    image: localaidocker/agent:locked
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
      args:
        BASE_IMAGE: ${AGENT_BASE_IMAGE:?Run scripts/llm.ps1 -Install first}
    command: ["python", "-m", "agent.nature_agent"]
    environment:
      LOCALAI_URL: http://localai:8080
      AGENT_BIND: 0.0.0.0:8090
      POLICY_FILE: /app/config/policy.json
      VERIFIED_MODEL_STATE_FILE: /app/deployment-state/current-deployment.json
      TASK_STATE_ROOT: /app/task-state
      HOST_BRIDGE_URL: http://gateway:8080/host-bridge
      HOST_BRIDGE_KEY_FILE: /run/secrets/host_bridge_key
      CODING_RUNNER_URL: http://coding-tools:8781
      MEDIA_RUNNER_URL: http://media-tools:8782
      DOCUMENTS_RUNNER_URL: http://document-tools:8783
      AGENT_PACKS: ${AGENT_PACKS:-core}
      HOST_BRIDGE_AVAILABLE: ${HOST_BRIDGE_AVAILABLE:-0}
      LOG_FILE: /app/logs/agent.jsonl
    secrets:
      - host_bridge_key
    depends_on:
      localai:
        condition: service_healthy
    expose:
      - "8090"
    networks:
      - inference
    volumes:
      - ./config/policy.json:/app/config/policy.json:ro
      - ./state:/app/deployment-state:ro
      - ./state/task-state:/app/task-state
      # The agent's editable workspace is deliberately separate from model,
      # backend, configuration, and deployment stores.  This prevents a
      # normal file tool from treating runtime internals as user documents.
      - ./data/workspace:/workspace
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  model-manager:
    image: localaidocker/model-manager:locked
    build:
      context: .
      dockerfile: docker/model-manager/Dockerfile
      args:
        BASE_IMAGE: ${AGENT_BASE_IMAGE:?Run scripts/llm.ps1 -Install first}
    profiles: ["install"]
    command: ["python", "-m", "agent.model_manager"]
    environment:
      MODEL_LOCK_FILE: /app/config/models.lock.json
      MODEL_OUTPUT_DIR: /models
      # Compose expands environment expressions for every service during
      # `config`, even when the install-only profile is not selected.  Keep
      # read-only checks usable with a receipt produced by an older launcher;
      # model_manager.py still rejects an empty value when this service is
      # actually run, and the installer writes the selected locked ID first.
      MODEL_ID: ${MODEL_ID:-}
    volumes:
      - ./config/models.lock.json:/app/config/models.lock.json:ro
      - ./data/models:/models
    networks:
      - download

networks:
  inference:
    internal: true
  download:
    internal: false
  frontend:
    # This network must be externally publishable for Docker Desktop's
    # Windows loopback port-forwarder.  Only the gateway is attached to it;
    # LocalAI and the agent remain isolated on the internal inference network.
    internal: false

secrets:
  localai_api_key:
    file: ./secrets/localai-api-key
  host_bridge_key:
    file: ./secrets/host-bridge-key
